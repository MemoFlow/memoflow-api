# Render blueprint for the "development" tier only (Item 0). Staging and
# production hosts are undecided — do not extend this file to those tiers
# without a corresponding CLAUDE.md update.
#
# This blueprint documents the shape of the dev web service and its managed
# Postgres for reference / first-time provisioning. The GitHub Actions
# deploy workflow (.github/workflows/deploy-dev.yml) drives actual deploys
# via a Render Deploy Hook so migrations run before rollout and a smoke
# check gates success — it does not rely on Render's git auto-deploy.
#
# MongoDB is NOT provisioned here: Render has no managed MongoDB offering.
# The dev Mongo instance is external (MongoDB Atlas, free M0 tier) and its
# connection string is set manually as the MONGODB_URI secret below.
#
# Redis is likewise NOT provisioned here: Render has no free managed Redis
# offering. The dev Redis (BullMQ queue) is external (Upstash, free tier)
# and TLS-only; its connection fields are set manually as sync:false
# secrets below.
databases:
  - name: memoflow-dev-postgres
    databaseName: memoflow_dev
    region: oregon
    plan: free

services:
  - type: web
    name: memoflow-dev-api
    env: node
    region: oregon
    plan: free
    autoDeploy: false # deploys are triggered by the GitHub Actions workflow via deploy hook
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: development
      - key: PORT
        value: 3000

      # MongoDB is external (Atlas M0) — set manually in the Render
      # dashboard, not derived from a Render-managed database.
      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        sync: false

      # Redis is external (Upstash free tier) — set manually in the Render
      # dashboard, not derived from a Render-managed resource. Upstash is
      # TLS-only, so REDIS_TLS is a plain (non-secret) literal.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"

      # Real frontend origin for the WebSocket gateway's CORS check — set
      # manually in the Render dashboard.
      - key: WS_CORS_ORIGIN
        sync: false

      # Composio is the OAuth token vault/MCP host for connectors — required
      # at boot (env validation fails without them). Set manually in the
      # Render dashboard. COMPOSIO_BASE_URL has a code default and is
      # intentionally omitted here.
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_AUTH_CONFIG_IDS
        sync: false
      - key: COMPOSIO_WEBHOOK_SECRET
        sync: false

      # Anthropic API key for the AI layer — optional at boot; AI
      # suggestion/planning endpoints return 503 without it. Set manually in
      # the Render dashboard. ANTHROPIC_MODEL/ANTHROPIC_MAX_TOKENS have code
      # defaults and are intentionally omitted here.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Postgres connection fields sourced from the managed database above.
      - key: POSTGRES_HOST
        fromDatabase:
          name: memoflow-dev-postgres
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: memoflow-dev-postgres
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: memoflow-dev-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: memoflow-dev-postgres
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: memoflow-dev-postgres
          property: database
